[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
    "crates/router",
    "crates/providers/common",
    "crates/providers/kimi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["kimi-switch contributors"]
repository = "https://github.com/firehot/kimi-subscription-router"
homepage = "https://github.com/firehot/kimi-subscription-router"
keywords = ["kimi", "moonshot", "quota"]
categories = ["command-line-utilities", "authentication"]

[workspace.dependencies]
# 错误处理
anyhow = "1"
thiserror = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = { version = "0.22", features = ["default"] }

# 异步运行时与 HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync", "io-util", "io-std", "process"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"

# 系统能力
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
directories = "5"
fs2 = "0.4"
sha2 = "0.10"
rand = "0.8"
subtle = "2"
tiny_http = "0.12"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# workspace 内部 crate 互相引用
kimi-switch-core = { path = "crates/core" }
kimi-switch-engine = { path = "crates/providers/common" }
kimi-switch-kimi = { path = "crates/providers/kimi" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
