name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Package Windows release
        shell: pwsh
        run: .\scripts\package-windows.ps1 release

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $paths = @(
            'target/release/Kimi Subscription Router.exe',
            'target/release/Kimi Subscription Router CLI.exe',
            'target/release/kimi-subscription-router.exe'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release artifact: $path"
            }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -le 0) {
              throw "Empty release artifact: $path"
            }
            Write-Host "$path ($($item.Length) bytes)"
          }
