name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-${{ runner.arch }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      - name: Package Windows release
        shell: pwsh
        run: .\scripts\package-windows.ps1 release

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $paths = @(
            'target/release/Kimi Subscription Router.exe',
            'target/release/Kimi Subscription Router CLI.exe',
            'target/release/kimi-subscription-router.exe'
          )
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release artifact: $path"
            }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -le 0) {
              throw "Empty release artifact: $path"
            }
            Write-Host "$path ($($item.Length) bytes)"
          }

      - name: Assemble downloadable package
        shell: pwsh
        run: |
          $package = 'target/windows-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath 'target/release/Kimi Subscription Router.exe' -Destination $package
          Copy-Item -LiteralPath 'target/release/Kimi Subscription Router CLI.exe' -Destination $package
          Copy-Item -LiteralPath 'target/release/kimi-subscription-router.exe' -Destination $package
          Get-ChildItem -LiteralPath $package -Filter '*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii -LiteralPath "$package/SHA256SUMS.txt"
          Compress-Archive -Path "$package/*" -DestinationPath 'target/kimi-subscription-router-windows-x86_64.zip' -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: kimi-subscription-router-windows-x86_64
          path: |
            target/kimi-subscription-router-windows-x86_64.zip
            target/windows-package/*
          if-no-files-found: error
          retention-days: 14
